<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>TogetherWatch 💕</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div class="stars-layer" id="stars-layer"></div>
  <div class="glow-blob rose"></div>
  <div class="glow-blob gold"></div>
  <div class="glow-blob purple"></div>

  <div class="lobby-container">
    <div class="lobby-card">
      <div class="logo-big">Together<span>♥</span>Watch</div>
      <p class="tagline">Watch movies together — no matter the distance 🌙</p>

      <!-- Couple identity -->
      <div class="couple-row">
        <div class="couple-field">
          <label class="couple-label label-you">💙 Your name</label>
          <input type="text" id="my-name" class="field-input you-input" placeholder="e.g. Vinu" maxlength="20"/>
        </div>
        <div class="couple-field">
          <label class="couple-label label-partner">💛 Partner's name</label>
          <input type="text" id="partner-name-input" class="field-input partner-input" placeholder="e.g. Bujji" maxlength="20"/>
        </div>
      </div>

      <div class="divider-text">— Choose an option —</div>

      <button class="btn-primary" id="create-btn" onclick="createRoom()">
        ✨ Create a New Room
      </button>

      <div class="join-section">
        <input type="text" id="join-code" class="field-input"
          placeholder="Enter Room Code (e.g. AB12CD)" maxlength="6"
          style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-size:18px;"
          onkeydown="if(event.key==='Enter') joinRoom()"/>
        <button class="btn-secondary" id="join-btn" onclick="joinRoom()">🔗 Join Room</button>
      </div>

      <div id="lobby-status"></div>
      <p class="hint">Share your room code with your partner. Works on iPhone &amp; Android! 📱</p>
    </div>
  </div>

  <script type="module" src="js/lobby.js"></script>
  <script>
    // Generate animated stars
    const layer = document.getElementById('stars-layer');
    for (let i = 0; i < 60; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 2.5 + 0.5;
      s.style.cssText = `
        width:${size}px;height:${size}px;
        top:${Math.random()*100}%;left:${Math.random()*100}%;
        --dur:${2+Math.random()*4}s;
        --delay:${Math.random()*5}s;
        --max-op:${0.3+Math.random()*0.7};
      `;
      layer.appendChild(s);
    }
    // Shooting stars
    for (let i = 0; i < 3; i++) {
      const sh = document.createElement('div');
      sh.className = 'shooting';
      sh.style.cssText = `top:${10+Math.random()*30}%;left:${Math.random()*50}%;animation-delay:${i*2.5}s;`;
      layer.appendChild(sh);
    }
  </script>
</body>
</html>
