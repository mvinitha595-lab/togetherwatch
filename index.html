<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TogetherWatch 💕</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;1,400&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="stars"></div>

  <div class="lobby-container">
    <div class="lobby-card">
      <div class="logo-big">Together<span>♥</span>Watch</div>
      <p class="tagline">Watch movies together — no matter the distance 🌙</p>

      <div class="name-section">
        <label class="field-label">Your name</label>
        <input type="text" id="my-name" class="field-input" placeholder="e.g. Priya or Alex" maxlength="20" />
      </div>

      <div class="divider-text">— Choose an option —</div>

      <button class="btn-primary" id="create-btn" onclick="createRoom()">
        ✨ Create a New Room
      </button>

      <div class="join-section">
        <input
          type="text"
          id="join-code"
          class="field-input"
          placeholder="Enter Room Code (e.g. AB12CD)"
          maxlength="6"
          style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-size:18px;"
          onkeydown="if(event.key==='Enter') joinRoom()"
        />
        <button class="btn-secondary" id="join-btn" onclick="joinRoom()">
          🔗 Join Room
        </button>
      </div>

      <div id="lobby-status" style="text-align:center;margin-top:14px;font-size:13px;color:rgba(255,255,255,0.5);min-height:20px;"></div>

      <p class="hint">Share your room code with your partner. Works on iPhone & Android! 📱</p>
    </div>
  </div>

  <!-- ONE module entry point only — lobby.js imports firebase itself -->
  <script type="module" src="js/lobby.js"></script>
</body>
</html>
